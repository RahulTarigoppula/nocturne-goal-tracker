# Build a SIGNED Capacitor APK in the cloud and attach it to a GitHub Release.
#   git tag v1.0.0 && git push origin v1.0.0   → APK on the Releases page.
# workflow_dispatch without the keystore secrets builds a debug-signed APK (installable, for testing only).
name: android-release
on:
  push: { tags: ['v*'] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: android-${{ github.ref }}, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - name: Build web app (base "/" because Capacitor serves from https://localhost/)
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE_PATH: /
          VITE_PLATFORM: android    # no service worker in the WebView
      - name: No service worker in the APK bundle
        run: test ! -f dist/sw.js
      - name: Sync web assets and plugins into android/
        run: npx cap sync android
      - name: Refuse to tag-release without a keystore
        if: github.ref_type == 'tag' && env.HAS_KEYSTORE != 'true'
        run: |
          echo "::error::Set ANDROID_KEYSTORE_BASE64 / _PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD first (docs/DEPLOYMENT.md)."
          exit 1
      - name: Decode keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease -PversionCode="$VERSION_CODE" -PversionName="${VERSION_NAME#v}"
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/nocturne-${VERSION_NAME#v}.apk"
      - name: Build debug-signed APK (no keystore configured)
        if: env.HAS_KEYSTORE != 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug -PversionCode="$VERSION_CODE" -PversionName="${VERSION_NAME#v}"
          mkdir -p ../out && cp app/build/outputs/apk/debug/app-debug.apk "../out/nocturne-${VERSION_NAME#v}-debug.apk"
      - name: Checksums and size budget (6 MB)
        run: |
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          ls -la out
          size=$(stat -c %s out/*.apk); echo "APK bytes: $size"; test "$size" -le 6291456
      - uses: actions/upload-artifact@v7
        with:
          name: apk-${{ env.VERSION_NAME }}
          path: out/
          retention-days: 14
      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            out/*.apk
            out/SHA256SUMS.txt

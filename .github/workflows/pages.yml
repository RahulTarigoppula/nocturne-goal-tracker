# Build the web app and publish it to the gh-pages branch, which GitHub Pages serves at
# https://<owner>.github.io/<repo>/. Lint and unit tests gate the deploy; e2e lives in ci.yml.
name: Deploy to GitHub Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: pages, cancel-in-progress: false }
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx biome ci .
      - run: npm run test:unit
      - name: Build (served from /<repo>/)
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      - name: Bundle budget (initial JS ≤ 180 KB gzip)
        run: node scripts/size-gate.mjs
      - name: SPA fallback and no Jekyll
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll
      - name: Publish dist/ to gh-pages
        run: |
          cd dist
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
